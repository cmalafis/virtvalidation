# Dependabot configuration for VirtValidate.
#
# Strategy: weekly cadence, grouped PRs to keep notification volume low. Each
# ecosystem opens at most one or two PRs per week — non-major patches/minors
# are bundled, majors stay separate so reviewers can audit them on their own.

version: 2
updates:
  # ---------- Python backend ----------
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    commit-message:
      prefix: "deps(py)"
      include: scope
    groups:
      backend-minor:
        applies-to: version-updates
        update-types: [minor, patch]
      backend-security:
        applies-to: security-updates

  # ---------- React frontend ----------
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    commit-message:
      prefix: "deps(js)"
      include: scope
    groups:
      frontend-minor:
        applies-to: version-updates
        update-types: [minor, patch]
      frontend-security:
        applies-to: security-updates

  # ---------- GitHub Actions versions ----------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: "deps(actions)"
      include: scope
    groups:
      actions-minor:
        applies-to: version-updates
        update-types: [minor, patch]

  # ---------- Container base images ----------
  # Both Containerfiles are under their respective component directories;
  # Dependabot picks up the FROM lines automatically.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels: [dependencies, container, backend]
    commit-message:
      prefix: "deps(docker)"
      include: scope

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels: [dependencies, container, frontend]
    commit-message:
      prefix: "deps(docker)"
      include: scope
