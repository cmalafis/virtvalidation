name: CI

# Lint + tests + secret scanning. Workflow scope is deliberately small:
# fast signal on the things developers actually act on. Security
# scanners (bandit / pip-audit / safety / trivy / SBOM) were removed in
# the CI simplification — they fired warnings nobody triaged. Re-add
# per-tool only when there's a concrete consumer for the output
# (customer audit, compliance review, etc).
#
# Job layout:
#   test        — ruff + pytest on the backend
#   frontend    — eslint + vite build on the frontend
#   gitleaks    — secret scanning, blocks on any finding
#
# CodeQL runs in its own workflow file (.github/workflows/codeql.yml).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest tests -q

  frontend:
    name: eslint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vite build (sanity check)
        run: npm run build

  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so PR-level scans see the diverged commits.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
