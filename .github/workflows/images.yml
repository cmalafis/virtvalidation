name: Build & scan images

# Builds backend + frontend container images and runs Trivy against
# each, uploading SARIF to the GitHub Security tab so the CVE delta
# between the standard UBI variant and the hardened RHHI variant
# stays visible.
#
# Trigger matrix:
#   - PRs: standard variant only (faster feedback; hardened doesn't
#     need per-PR coverage and pulls from registry.redhat.io which
#     requires fork-unsafe secrets).
#   - Pushes to main: both standard and hardened.
#
# Trivy steps use exit-code=0 (surface-only). Flip to gating in a
# follow-up PR once the standard image's high+critical baseline is
# committed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan-standard:
    name: Scan ${{ matrix.component }} (standard)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (frontend only)
        if: matrix.component == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend dist
        if: matrix.component == 'frontend'
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build image
        run: |
          if [ "${{ matrix.component }}" = "backend" ]; then
            CF=backend/Containerfile
            CTX=.
          else
            CF=frontend/Containerfile.runtime
            CTX=./frontend
          fi
          docker build \
            --build-arg VERSION=ci-${{ github.sha }} \
            --build-arg VCS_REF=${{ github.sha }} \
            -t local/virtvalidate-${{ matrix.component }}-standard:ci \
            -f "$CF" "$CTX"

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/virtvalidate-${{ matrix.component }}-standard:ci
          format: sarif
          output: trivy-${{ matrix.component }}-standard.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.component }}-standard.sarif
          category: trivy-${{ matrix.component }}-standard

  scan-hardened:
    name: Scan ${{ matrix.component }} (hardened)
    # Hardened build pulls from registry.redhat.io and needs the
    # REDHAT_REGISTRY_* secrets which aren't exposed to PRs from forks.
    # Run on direct pushes to main only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    env:
      HARDENED_PYTHON: ${{ vars.HARDENED_PYTHON_IMAGE }}
      HARDENED_NGINX: ${{ vars.HARDENED_NGINX_IMAGE }}
    steps:
      - uses: actions/checkout@v4

      - name: Check hardened base availability
        id: gate
        run: |
          if [ "${{ matrix.component }}" = "backend" ] && [ -z "${HARDENED_PYTHON:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::HARDENED_PYTHON_IMAGE repository variable unset; skipping backend hardened scan"
          elif [ "${{ matrix.component }}" = "frontend" ] && [ -z "${HARDENED_NGINX:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::HARDENED_NGINX_IMAGE repository variable unset; skipping frontend hardened scan"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node (frontend only)
        if: steps.gate.outputs.skip != 'true' && matrix.component == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend dist
        if: steps.gate.outputs.skip != 'true' && matrix.component == 'frontend'
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Log in to registry.redhat.io
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "${{ secrets.REDHAT_REGISTRY_TOKEN }}" \
            | docker login registry.redhat.io \
                -u "${{ secrets.REDHAT_REGISTRY_USER }}" \
                --password-stdin

      - name: Build hardened image
        if: steps.gate.outputs.skip != 'true'
        run: |
          if [ "${{ matrix.component }}" = "backend" ]; then
            CF=backend/Containerfile.hardened
            CTX=.
            BASE="$HARDENED_PYTHON"
          else
            CF=frontend/Containerfile.runtime.hardened
            CTX=./frontend
            BASE="$HARDENED_NGINX"
          fi
          docker build \
            --build-arg VERSION=ci-${{ github.sha }}-hardened \
            --build-arg VCS_REF=${{ github.sha }} \
            --build-arg BASE_IMAGE="$BASE" \
            -t local/virtvalidate-${{ matrix.component }}-hardened:ci \
            -f "$CF" "$CTX"

      - name: Trivy scan
        if: steps.gate.outputs.skip != 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/virtvalidate-${{ matrix.component }}-hardened:ci
          format: sarif
          output: trivy-${{ matrix.component }}-hardened.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload Trivy SARIF
        if: always() && steps.gate.outputs.skip != 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.component }}-hardened.sarif
          category: trivy-${{ matrix.component }}-hardened
