name: Lighthouse a11y

# Federal-friendly target: WCAG AA. We gate the accessibility audit at 0.9
# minimum on every PR and push to main. Performance/SEO are collected but
# not enforced — see frontend/lighthouserc.cjs.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/lighthouse.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/lighthouse.yml"

permissions:
  contents: read

jobs:
  lighthouse:
    name: Accessibility audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        # treosh/lighthouse-ci-action handles installing the Chrome runtime
        # and running the suite against the previewed build per the rc file.
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: ./frontend/lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: true
