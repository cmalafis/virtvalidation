name: architecture docs

# Regenerates docs/ARCHITECTURE.md and docs/architecture-diagram.html from
# source on every push to main and every PR, then fails if the regenerated
# files differ from what's committed. Catches the common case of "I added
# a new endpoint / model / component and forgot to refresh the docs".

on:
  push:
    branches: [main]
    paths:
      - "backend/app/**/*.py"
      - "frontend/src/**/*.jsx"
      - "frontend/src/**/*.js"
      - "scripts/generate_architecture_docs.py"
      - "docs/ARCHITECTURE.md"
      - "docs/architecture-diagram.html"
      - ".github/workflows/architecture-docs.yml"
  pull_request:
    paths:
      - "backend/app/**/*.py"
      - "frontend/src/**/*.jsx"
      - "frontend/src/**/*.js"
      - "scripts/generate_architecture_docs.py"
      - "docs/ARCHITECTURE.md"
      - "docs/architecture-diagram.html"
      - ".github/workflows/architecture-docs.yml"

permissions:
  contents: read

jobs:
  drift:
    name: regenerate + diff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The generator only uses the standard library — no `pip install`
      # step required.
      - name: Regenerate architecture docs
        run: python3 scripts/generate_architecture_docs.py

      - name: Verify no drift
        run: |
          if ! git diff --exit-code -- docs/ARCHITECTURE.md docs/architecture-diagram.html; then
            echo "::error::Architecture docs are out of date."
            echo "::error::Run 'python3 scripts/generate_architecture_docs.py' locally and commit the diff."
            exit 1
          fi
          echo "Architecture docs are in sync with source."
