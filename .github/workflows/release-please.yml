name: release-please

# Watches `main` for Conventional Commits and maintains a perpetual
# "Release v…" PR. Merging that PR cuts the next semver release: it
# pushes a tag (v0.x.y), updates CHANGELOG.md, and creates a GitHub
# Release. The release-images workflow takes over from there.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Manifest mode keeps the current version in
          # .release-please-manifest.json so release-please can resume
          # state across runs without scanning history every time.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
