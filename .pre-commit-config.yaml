# Solo-mode pre-commit: gitleaks only.
#
# CI is the source of truth for ruff / pytest / build correctness — see
# .github/workflows/ci.yml. The local hook chain is deliberately minimal
# so `git commit` is fast and never reformats files mid-commit (which
# previously forced a re-stage cycle and trained the operator to reach
# for --no-verify).
#
# Why gitleaks stays blocking: a leaked private key or cloud credential
# in git history is *unrecoverable* — rewriting history doesn't undo the
# fact that GitHub, mirrors, caches, and any cloner already have it. The
# only effective defense is catching the leak before push. Worth the
# ~1 second per commit.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
