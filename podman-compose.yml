version: "3.9"

# VirtValidate — Podman Compose
# Run with: podman-compose up -d
# Rootless by default — no daemon required

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    ports:
      # Host port 3000 keeps the dev workflow unchanged. UBI nginx
      # listens on 8080 inside the container; the host port stays
      # arbitrary.
      - "3000:8080"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      # nginx.conf is now templated at container start by
      # entrypoint.sh — these two values feed the /api/ proxy_pass
      # upstream. The same image works under the Helm chart, which
      # supplies its own release-prefixed BACKEND_HOST.
      - BACKEND_HOST=backend
      - BACKEND_PORT=8000
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      # Repo root so the Containerfile can reach docs/vm-inventory-template.csv
      # alongside backend/.
      context: .
      dockerfile: backend/Containerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LLM_BACKEND_TYPE=mock
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3:8b}
      - SECRET_KEY=${SECRET_KEY}
      - SSH_KEY_PATH=${SSH_KEY_PATH:-/app/keys/id_ed25519}
    volumes:
      # /app is a symlink to /opt/app-root/src inside the UBI image,
      # so the existing /app/keys path keeps working without forcing
      # operators to update SSH_KEY_PATH defaults or .env files.
      - ./backend/app/keys:/opt/app-root/src/keys:Z
      # ----- DEVELOPMENT-ONLY bind mounts -----
      # Mount the source tree on top of the baked image so uvicorn's
      # --reload flag picks up edits without a container rebuild. Save a
      # .py file → uvicorn detects the change → reloads the app inside
      # the running container. Dev iteration in seconds instead of minutes.
      #
      # DO NOT replicate these mounts in infra/quadlet/ for production —
      # production must run the immutable baked image so the deployed code
      # matches the signed/attested artifact. The Quadlet units intentionally
      # only mount /app/keys and the Postgres/Ollama data volumes.
      - ./backend/app:/opt/app-root/src/app:Z
      - ./backend/migrations:/opt/app-root/src/migrations:Z
    depends_on:
      - postgres
      - ollama
    restart: unless-stopped

  postgres:
    image: docker.io/postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-virtvalidate}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-virtvalidate}
    volumes:
      - pgdata:/var/lib/postgresql/data:Z
    ports:
      - "5432:5432"
    restart: unless-stopped

  ollama:
    image: docker.io/ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama:Z
    # Uncomment if you have an NVIDIA GPU:
    # devices:
    #   - nvidia.com/gpu=all
    restart: unless-stopped

volumes:
  pgdata:
  ollamadata:
