{{- if and (eq .Values.llm.backend "ollama") .Values.llm.ollama.deploy -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "virtvalidate.fullname" . }}-ollama
  labels:
    {{- include "virtvalidate.componentLabels" (dict "root" . "component" "ollama") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.llm.ollama.service.port }}
      targetPort: ollama
      protocol: TCP
      name: ollama
  selector:
    {{- include "virtvalidate.componentSelectorLabels" (dict "root" . "component" "ollama") | nindent 4 }}
{{- end }}
