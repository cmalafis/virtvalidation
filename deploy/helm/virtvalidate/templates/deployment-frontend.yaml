apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "virtvalidate.fullname" . }}-frontend
  labels:
    {{- include "virtvalidate.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "virtvalidate.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "virtvalidate.componentLabels" (dict "root" . "component" "frontend") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "virtvalidate.serviceAccountName" . }}
      {{- include "virtvalidate.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.security.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "virtvalidate.image" (dict "root" . "imageRepo" .Values.frontend.image.repository "imageTag" .Values.frontend.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              # UBI nginx-124 listens on 8080. The Service still
              # publishes on 3000 (see service-frontend.yaml) — only
              # the in-pod port changed.
              containerPort: 8080
              protocol: TCP
          env:
            # nginx.conf is templated. entrypoint.sh runs envsubst at
            # container start, injecting these two values so the
            # ``proxy_pass`` upstream resolves to the chart's own
            # backend Service no matter what ``--release-name`` was
            # passed to ``helm install``. The literal "backend"
            # hostname worked under podman-compose but broke on
            # OpenShift where the Service is namespaced.
            - name: BACKEND_HOST
              value: {{ include "virtvalidate.fullname" . }}-backend
            - name: BACKEND_PORT
              value: "{{ .Values.backend.service.port | default 8000 }}"
            {{- with .Values.frontend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.security.containerSecurityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            # UBI nginx writes its temp files under /tmp + /var/lib/nginx;
            # OCP's readOnlyRootFilesystem means we have to provide a
            # writable mount for each. emptyDir pattern matches the
            # backend's writable scratch volumes.
            - name: tmp
              mountPath: /tmp
            - name: nginx-lib
              mountPath: /var/lib/nginx
            - name: nginx-run
              mountPath: /run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-lib
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
