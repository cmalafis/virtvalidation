apiVersion: v1
kind: Service
metadata:
  name: {{ include "virtvalidate.fullname" . }}-frontend
  labels:
    {{- include "virtvalidate.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "virtvalidate.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
