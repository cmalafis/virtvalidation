{{- if and .Values.llm.maas.enabled (not .Values.llm.maas.existingSecret) .Values.llm.maas.apiKey -}}
{{/*
Chart-managed MaaS API key Secret. Only rendered when:
  - llm.maas.enabled is true, AND
  - The operator did NOT point at an existingSecret, AND
  - --set llm.maas.apiKey=<KEY> provided a value at install/upgrade time.

Production deployments should externalize this Secret (Vault, ESO,
sealed-secrets) and set llm.maas.existingSecret instead — committing
the key to Helm values is a CI / git-history risk.

The key is mounted into the backend Deployment as the env var
LLM_MAAS_API_KEY via secretKeyRef in _helpers.tpl::llmEnv. It never
appears in ConfigMaps, never in deployment manifests, never in pod
specs.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "virtvalidate.fullname" . }}-maas
  labels:
    {{- include "virtvalidate.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.llm.maas.existingSecretKey }}: {{ .Values.llm.maas.apiKey | b64enc }}
{{- end }}
