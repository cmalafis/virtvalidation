{{- if and .Values.postgres.enabled (not .Values.postgres.auth.existingSecret) -}}
{{/*
Chart-managed Postgres credentials. Production deployments should
externalize this Secret (Vault, ESO, sealed-secrets) and set
postgres.auth.existingSecret instead.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "virtvalidate.fullname" . }}-postgres
  labels:
    {{- include "virtvalidate.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_DB: {{ .Values.postgres.auth.database | b64enc }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | b64enc }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | b64enc }}
{{- end }}
