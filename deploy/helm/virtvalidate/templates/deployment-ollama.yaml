{{- if and (eq .Values.llm.backend "ollama") .Values.llm.ollama.deploy -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "virtvalidate.fullname" . }}-ollama
  labels:
    {{- include "virtvalidate.componentLabels" (dict "root" . "component" "ollama") | nindent 4 }}
spec:
  replicas: 1
  # Recreate — Ollama's model cache PVC is RWO. The model is the heavy
  # asset; we'd rather take a brief downtime on upgrade than re-download
  # multiple gigabytes onto a second pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "virtvalidate.componentSelectorLabels" (dict "root" . "component" "ollama") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "virtvalidate.componentLabels" (dict "root" . "component" "ollama") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "virtvalidate.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.security.podSecurityContext | nindent 8 }}
      containers:
        - name: ollama
          image: "{{ .Values.llm.ollama.image.registry }}/{{ .Values.llm.ollama.image.repository }}:{{ .Values.llm.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: ollama
              containerPort: 11434
              protocol: TCP
          # Wrapper: serve, wait for the API, pull the configured model if
          # it isn't on the PVC yet, then hand back to the server. Nothing
          # else pulls the model — a fresh install would otherwise answer
          # every chat call with "model not found".
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve &
              pid=$!
              until ollama list >/dev/null 2>&1; do sleep 1; done
              ollama list | grep -q "^${OLLAMA_MODEL} " || ollama pull "${OLLAMA_MODEL}"
              wait $pid
          env:
            # HOME and OLLAMA_MODELS both live on the PVC. Under
            # restricted-v2 the pod runs as an arbitrary UID with no
            # writable /root, and Ollama writes its identity key to
            # $HOME/.ollama on startup.
            - name: HOME
              value: /ollama
            - name: OLLAMA_MODELS
              value: /ollama/models
            - name: OLLAMA_MODEL
              value: {{ .Values.llm.ollama.model | quote }}
          securityContext:
            {{- toYaml .Values.security.containerSecurityContext | nindent 12 }}
          readinessProbe:
            # /api/tags answers as soon as the server is up; the model
            # pull runs after it, so readiness doesn't wait on gigabytes.
            httpGet:
              path: /api/tags
              port: ollama
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.llm.ollama.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /ollama
      volumes:
        - name: models
          {{- if .Values.llm.ollama.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "virtvalidate.fullname" . }}-ollama-models
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
