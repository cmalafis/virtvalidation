{{- if .Values.postgres.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "virtvalidate.fullname" . }}-postgres
  labels:
    {{- include "virtvalidate.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ include "virtvalidate.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "virtvalidate.componentSelectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "virtvalidate.componentLabels" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.security.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.registry }}/{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "virtvalidate.postgresSecretName" . }}
          env:
            {{- if .Values.postgres.image.useRedHatImage }}
            # registry.redhat.io/rhel9/postgresql-16 reads
            # POSTGRESQL_USER / POSTGRESQL_PASSWORD / POSTGRESQL_DATABASE
            # (with the QL). The chart-managed Secret uses the upstream
            # POSTGRES_* names; alias them here so the same Secret
            # works for both images. Kubelet's $(VAR) substitution
            # only sees vars defined earlier in the same env list, so
            # these aliases must come first.
            - name: POSTGRESQL_USER
              value: $(POSTGRES_USER)
            - name: POSTGRESQL_PASSWORD
              value: $(POSTGRES_PASSWORD)
            - name: POSTGRESQL_DATABASE
              value: $(POSTGRES_DB)
            {{- else }}
            # postgres:16-alpine writes data to /var/lib/postgresql/data
            # by default; the PGDATA override below uses a subdirectory
            # so the mount point itself isn't expected to be the data
            # directory (some storage drivers add a lost+found/ which
            # postgres would otherwise refuse to initialize into).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- end }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              # The two images write their data dir to different paths.
              # rhel9/postgresql-16 → /var/lib/pgsql/data
              # postgres:16-alpine  → /var/lib/postgresql/data (+PGDATA)
              mountPath: {{ if .Values.postgres.image.useRedHatImage }}/var/lib/pgsql/data{{ else }}/var/lib/postgresql/data{{ end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "virtvalidate.componentLabels" (dict "root" . "component" "postgres") | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.persistence.postgres.size }}
        {{- with .Values.persistence.postgres.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
{{- end }}
