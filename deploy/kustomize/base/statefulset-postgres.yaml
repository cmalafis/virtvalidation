apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: virtvalidate-postgres
  labels:
    app.kubernetes.io/name: virtvalidate
    app.kubernetes.io/component: postgres
spec:
  serviceName: virtvalidate-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: virtvalidate
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: virtvalidate
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: virtvalidate-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          livenessProbe:
            exec:
              command: [pg_isready, -U, "$(POSTGRES_USER)", -d, "$(POSTGRES_DB)"]
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec:
              command: [pg_isready, -U, "$(POSTGRES_USER)", -d, "$(POSTGRES_DB)"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
