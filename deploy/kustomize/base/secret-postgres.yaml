# Default credentials — production overlays MUST replace this with a
# secret managed by Vault / External Secrets / sealed-secrets.
# Leaving "changeme" here is intentional: it forces operators to look
# at the file before deploying.
apiVersion: v1
kind: Secret
metadata:
  name: virtvalidate-postgres
type: Opaque
stringData:
  POSTGRES_DB: virtvalidate
  POSTGRES_USER: virtvalidate
  POSTGRES_PASSWORD: changeme
