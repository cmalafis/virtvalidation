apiVersion: apps/v1
kind: Deployment
metadata:
  name: virtvalidate-ollama
  labels:
    app.kubernetes.io/name: virtvalidate
    app.kubernetes.io/component: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: virtvalidate
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: virtvalidate
        app.kubernetes.io/component: ollama
    spec:
      serviceAccountName: virtvalidate
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:latest
          ports:
            - name: ollama
              containerPort: 11434
          env:
            - name: OLLAMA_MODELS
              value: /root/.ollama/models
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              cpu: 4000m
              memory: 16Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: virtvalidate-ollama-models
