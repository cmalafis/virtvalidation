apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Standalone overlay — base + the in-namespace Ollama deployment.
# Use this when the cluster doesn't have RHOAI / KServe and you want a
# self-contained installation. Ollama keeps its model cache on a PVC
# so pod restarts don't re-download the weights.

namespace: virtvalidate

resources:
  - ../../base
  - ollama-deployment.yaml
  - ollama-service.yaml
  - ollama-pvc.yaml
