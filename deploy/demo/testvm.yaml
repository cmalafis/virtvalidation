---
# Throwaway RHEL 9 target used to exercise VirtValidate's SSH collection
# path against a real host. Not part of the product — lives in /tmp.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vv-testvm-01
  labels:
    app: vv-testvm
    virtvalidate.io/purpose: validation-target
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: vv-testvm-01-root
      spec:
        sourceRef:
          kind: DataSource
          name: rhel9
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
          storageClassName: gp3-csi
  template:
    metadata:
      labels:
        kubevirt.io/domain: vv-testvm-01
        app: vv-testvm
    spec:
      domain:
        cpu:
          cores: 1
        memory:
          guest: 2Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
          networkInterfaceMultiqueue: true
        resources:
          requests:
            cpu: 250m
            memory: 2Gi
          limits:
            cpu: 1
            memory: 2Gi
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: rootdisk
          dataVolume:
            name: vv-testvm-01-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              user: cloud-user
              ssh_authorized_keys:
                - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDGNOsnwBROozeh/dUbUHMizkTs7E6vU77LRjkof9G9s virtvalidate-appliance
                - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsr0LeeG7KaLTB5YEcAUiz11vTwnl83GVt5k2pXQaht virtvalidate-appliance
              ssh_pwauth: false
              disable_root: true
              runcmd:
                - [ systemctl, enable, --now, sshd ]
---
# ClusterIP Service so the VirtValidate backend pod can reach the VM's
# sshd by in-cluster DNS: vv-testvm-01.virtvalidate-dev.svc.cluster.local:22
apiVersion: v1
kind: Service
metadata:
  name: vv-testvm-01
  labels:
    app: vv-testvm
spec:
  type: ClusterIP
  selector:
    kubevirt.io/domain: vv-testvm-01
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: 22
